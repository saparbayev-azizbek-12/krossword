 if(!cell[k]){d.className+=" b"}else{var x=cell[k],inp=document.createElement("input");inp.maxLength=1;inp.autocomplete="off";inp.dataset.k=k;x.el=inp;

 g.appendChild(d)}

 document.getElementById("msg").textContent=ok==tot?"Barakalla! Hammasi to‘g‘ri!":ok+" / "+tot+" harf to‘g‘ri"};
